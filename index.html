<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açık Ses Deposu</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .upload-card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: var(--text);
      outline: none;
    }

    input[type="file"] {
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .audio-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .audio-card {
      background-color: var(--card-bg);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .audio-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .audio-title {
      font-weight: 600;
    }

    .audio-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    audio {
      width: 100%;
      height: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Açık Ses Deposu 🎵</h1>
      <p>İstediğiniz ses dosyasını yükleyin ve dinleyin.</p>
    </header>

    <div class="upload-card">
      <div class="form-group">
        <label for="title">Ses Başlığı</label>
        <input type="text" id="title" placeholder="Örn: Kuş Sesi / Kendi Kaydım">
      </div>
      <div class="form-group">
        <label for="audioFile">Ses Dosyası Seç (MP3, WAV, OGG)</label>
        <input type="file" id="audioFile" accept="audio/*">
      </div>
      <button onclick="uploadAudio()">Sesi Yükle</button>
    </div>

    <div class="audio-list" id="audioList">
      <!-- Ses Kartları Buraya Eklenecek -->
    </div>
  </div>

  <script>
    // Sayfa yüklendiğinde hafızadaki sesleri getir
    document.addEventListener("DOMContentLoaded", loadAudios);

    function uploadAudio() {
      const titleInput = document.getElementById('title');
      const fileInput = document.getElementById('audioFile');

      if (!titleInput.value || !fileInput.files[0]) {
        alert("Lütfen bir başlık girin ve bir ses dosyası seçin!");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const audioData = {
          id: Date.now(),
          title: titleInput.value,
          src: e.target.result,
          date: new Date().toLocaleDateString('tr-TR')
        };

        saveAudioToStorage(audioData);
        renderAudio(audioData);

        // Formu temizle
        titleInput.value = '';
        fileInput.value = '';
      };

      reader.readAsDataURL(file);
    }

    function saveAudioToStorage(audio) {
      let audios = JSON.parse(localStorage.getItem('user_audios') || '[]');
      audios.unshift(audio);
      localStorage.setItem('user_audios', JSON.stringify(audios));
    }

    function loadAudios() {
      let audios = JSON.parse(localStorage.getItem('user_audios') || '[]');
      audios.forEach(renderAudio);
    }

    function renderAudio(audio) {
      const list = document.getElementById('audioList');
      const card = document.createElement('div');
      card.className = 'audio-card';
      card.innerHTML = `
        <div class="audio-info">
          <span class="audio-title">${escapeHtml(audio.title)}</span>
          <span class="audio-date">${audio.date}</span>
        </div>
        <audio controls src="${audio.src}"></audio>
      `;
      list.prepend(card);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
