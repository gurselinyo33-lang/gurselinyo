<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Açık Ses Deposu 🎵</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    input[type="file"] {
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .search-box {
      margin-bottom: 1rem;
    }

    .audio-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .audio-card {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .audio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .audio-title {
      font-weight: 600;
      font-size: 1.05rem;
      word-break: break-word;
    }

    .audio-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .audio-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-right: 0.5rem;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      text-decoration: none;
      transition: color 0.2s, background 0.2s;
    }

    .btn-icon:hover {
      color: var(--text);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .btn-icon.delete:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.1);
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 6px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Açık Ses Deposu 🎵</h1>
      <p>İstediğiniz ses dosyasını yükleyin, saklayın ve dinleyin.</p>
    </header>

    <!-- Ses Yükleme Kartı -->
    <div class="card">
      <div class="form-group">
        <label for="title">Ses Başlığı</label>
        <input type="text" id="title" placeholder="Örn: Kuş Sesi / Ders Kaydı / Şarkı" maxlength="60">
      </div>
      <div class="form-group">
        <label for="audioFile">Ses Dosyası Seç (MP3, WAV, OGG)</label>
        <input type="file" id="audioFile" accept="audio/*">
      </div>
      <button class="btn-primary" onclick="uploadAudio()">Sesi Yükle</button>
    </div>

    <!-- Arama Kutusu -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Yüklenen seslerde ara..." oninput="filterAudios()">
    </div>

    <!-- Ses Listesi -->
    <div class="audio-list" id="audioList">
      <!-- Sesler dinamik eklenecektir -->
    </div>
  </div>

  <script>
    let allAudios = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadAudios();
    });

    function uploadAudio() {
      const titleInput = document.getElementById('title');
      const fileInput = document.getElementById('audioFile');
      const titleText = titleInput.value.trim();
      const file = fileInput.files[0];

      if (!titleText) {
        alert("Lütfen ses için bir başlık girin.");
        return;
      }

      if (!file) {
        alert("Lütfen yüklemek için bir ses dosyası seçin.");
        return;
      }

      if (file.size > 8 * 1024 * 1024) {
        alert("Dosya boyutu çok büyük! Lütfen 8MB'tan küçük bir dosya yükleyin.");
        return;
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        const audioData = {
          id: Date.now(),
          title: titleText,
          src: e.target.result,
          date: new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' })
        };

        saveAudioToStorage(audioData);
        
        // Formu temizle
        titleInput.value = '';
        fileInput.value = '';
      };

      reader.readAsDataURL(file);
    }

    function saveAudioToStorage(audio) {
      try {
        allAudios.unshift(audio);
        localStorage.setItem('user_audios', JSON.stringify(allAudios));
        renderList(allAudios);
      } catch (e) {
        alert("Depolama alanı doldu! Lütfen eski seslerden bazılarını silin.");
      }
    }

    function loadAudios() {
      const stored = localStorage.getItem('user_audios');
      if (stored) {
        try {
          allAudios = JSON.parse(stored);
        } catch(e) {
          allAudios = [];
        }
      }
      renderList(allAudios);
    }

    function deleteAudio(id) {
      if (confirm("Bu sesi silmek istediğinize emin misiniz?")) {
        allAudios = allAudios.filter(audio => audio.id !== id);
        localStorage.setItem('user_audios', JSON.stringify(allAudios));
        renderList(allAudios);
      }
    }

    function filterAudios() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allAudios.filter(audio => audio.title.toLowerCase().includes(query));
      renderList(filtered);
    }

    function renderList(list) {
      const listElement = document.getElementById('audioList');
      listElement.innerHTML = '';

      if (list.length === 0) {
        listElement.innerHTML = '<div class="empty-state">Henüz eklenmiş bir ses dosyası yok.</div>';
        return;
      }

      list.forEach(audio => {
        const card = document.createElement('div');
        card.className = 'audio-card';
        card.innerHTML = `
          <div class="audio-header">
            <span class="audio-title">${escapeHtml(audio.title)}</span>
            <div class="audio-actions">
              <span class="audio-date">${audio.date}</span>
              <a href="${audio.src}" download="${escapeHtml(audio.title)}.mp3" class="btn-icon" title="İndir">⬇️</a>
              <button class="btn-icon delete" onclick="deleteAudio(${audio.id})" title="Sil">🗑️</button>
            </div>
          </div>
          <audio controls src="${audio.src}"></audio>
        `;
        listElement.appendChild(card);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
